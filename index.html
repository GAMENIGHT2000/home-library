
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#294534">
<title>The Enchanted Library</title>
<style>
:root {
  --forest:#294534;
  --deep:#1e3428;
  --sage:#adc2a7;
  --gold:#c7a86b;
  --paper:#f8f4e7;
  --ink:#263b2e;
}
* { box-sizing:border-box; }
body {
  margin:0;
  color:var(--ink);
  font-family:Georgia,serif;
  background:
    linear-gradient(#e8efe1a8,#e8efe1a8),
    url("Sage%20Green%20Oak%20Leaf%20Shimmer.webp") center / cover fixed,
    radial-gradient(ellipse at 15% 15%,#bed1b7 0,transparent 45%),
    radial-gradient(ellipse at 85% 70%,#91aa91 0,transparent 50%),
    repeating-linear-gradient(
      120deg,transparent 0 35px,#284d3510 36px 37px
    ),
    #d9e4d3;
  min-height:100vh;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
header {
  padding:42px 16px;
  text-align:center;
  color:#f9f2dc;
  background:
    linear-gradient(120deg,#162a20a8,#385941b8),
    url("Ornate%20Golden%20Vines%20on%20Forest%20Green.webp") center / cover,
    radial-gradient(circle at 50% 0,#9fae8c,#20392c);
  border-bottom:5px double var(--gold);
}
h1 {
  font-weight:normal;
  font-size:clamp(35px,7vw,62px);
  margin:8px 0;
}
header p { font-style:italic; }
.ornament {
  color:#e8cb89;
  letter-spacing:8px;
  font-size:23px;
}
nav {
  background:var(--deep);
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
  border-bottom:2px solid var(--gold);
}
nav button {
  background:transparent;
  color:#f8f0dc;
  border:1px solid var(--gold);
  border-radius:8px;
  padding:12px 16px;
}
nav button.active,nav button:hover {
  background:var(--gold);
  color:var(--deep);
}
main {
  max-width:1180px;
  margin:auto;
  padding:24px 16px 70px;
}
.intro {
  padding:25px;
  text-align:center;
  background:#faf7ebed;
  border:3px double var(--gold);
  border-radius:12px;
  box-shadow:0 8px 25px #20372725;
  margin-bottom:25px;
}
.intro h2,.section { color:var(--forest); }
.gold {
  background:linear-gradient(#dfcb97,#b59556);
  border:1px solid #826634;
  color:#25372b;
  border-radius:8px;
  padding:12px 18px;
  font-weight:bold;
}
.gold:hover { filter:brightness(1.08); }
.gold:disabled { opacity:.6;cursor:wait; }
.primary { font-size:19px;margin-top:10px; }
.search {
  width:100%;
  padding:15px;
  border:2px solid #8da487;
  border-radius:9px;
  background:#fffdf8;
  font-size:17px;
}
.filters {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:14px 0 24px;
}
.filters select {
  flex:1;
  min-width:140px;
  padding:12px;
  border:1px solid var(--gold);
  border-radius:8px;
  background:var(--paper);
}
.section {
  border-bottom:2px solid var(--gold);
  padding-bottom:10px;
}
.status {
  text-align:center;
  color:#3b5c42;
  font-style:italic;
  min-height:24px;
}
.grid {
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}
.book {
  background:#fcf9ee;
  border:2px solid #bba577;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 6px 16px #253b2c25;
}
.cover {
  height:230px;
  background:linear-gradient(135deg,#38583f,#769477);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f7e8b7;
  border-bottom:3px double var(--gold);
}
.cover img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.placeholder { font-size:54px; }
.info { padding:17px; }
.info h3 { color:var(--forest);margin:0 0 8px; }
.info p { margin:7px 0; }
.tag {
  display:inline-block;
  padding:5px 8px;
  margin:5px 4px 5px 0;
  background:#dce9d7;
  border:1px solid #a5bba0;
  border-radius:15px;
  font-size:12px;
}
.card-button { width:100%;margin-top:12px; }
dialog {
  border:2px solid var(--gold);
  border-radius:12px;
  background:var(--paper);
  color:var(--ink);
  width:min(580px,94vw);
  max-height:90vh;
  overflow:auto;
  padding:24px;
}
dialog::backdrop { background:#14251bbb; }
.close {
  float:right;
  border:0;
  background:transparent;
  font-size:28px;
}
.field { margin:12px 0; }
.field label {
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}
.field input,.field select,.field textarea {
  width:100%;
  padding:11px;
  border:1px solid #91a48b;
  border-radius:6px;
  background:#fffdf8;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:14px 0;
}
.actions button { flex:1; }
#scanner {
  width:100%;
  max-height:280px;
  background:#14251b;
  border-radius:8px;
}
[hidden] { display:none!important; }
.message { min-height:22px;font-style:italic; }
footer {
  text-align:center;
  background:var(--deep);
  color:#efe4c8;
  padding:25px;
  border-top:3px double var(--gold);
}
@media(max-width:600px) {
  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .cover { height:165px; }
  .info { padding:12px; }
  .info h3 { font-size:17px; }
  nav button { flex:1 1 40%; }
}
</style>
</head>
<body>
<header>
  <div class="ornament">❧ ✦ ❧</div>
  <h1>The Enchanted Library</h1>
  <p>A realm of stories, adventures, and forgotten worlds</p>
  <div class="ornament">❦ ✧ ❦</div>
</header>

<nav aria-label="Library navigation">
  <button class="active" data-view="all">Grand Library</button>
  <button data-view="shelves">Shelves</button>
  <button data-view="read">Reading Journal</button>
  <button data-view="loans">Books on Loan</button>
</nav>

<main>
  <section class="intro">
    <div class="ornament">❦ ✧ ❦</div>
    <h2>Welcome, Keeper of Stories</h2>
    <p>Every book is a doorway to another world.</p>
    <button class="gold primary" id="addButton">
      ✦ Add New Book
    </button>
  </section>

  <input id="search" class="search" type="search"
    placeholder="Search titles, authors, ISBN..."
    aria-label="Search books">

  <div class="filters">
    <select id="shelf" aria-label="Shelf">
      <option value="">All Shelves</option>
    </select>
    <select id="genre" aria-label="Genre">
      <option value="">All Genres</option>
    </select>
    <select id="author" aria-label="Author">
      <option value="">All Authors</option>
    </select>
    <select id="reading" aria-label="Reading status">
      <option value="">All Reading Statuses</option>
      <option>Unread</option>
      <option>Currently Reading</option>
      <option>Read</option>
    </select>
  </div>

  <h2 id="section" class="section">✦ The Grand Library</h2>
  <p id="status" class="status" role="status">
    Loading your library...
  </p>
  <div id="grid" class="grid"></div>
</main>

<dialog id="editor">
  <button id="closeEditor" class="close"
    aria-label="Close">×</button>
  <h2 id="editorTitle">Add Book</h2>

  <div class="field">
    <label for="isbn">ISBN / Barcode</label>
    <input id="isbn" inputmode="numeric"
      placeholder="Enter or scan ISBN">
  </div>

  <div class="actions">
    <button type="button" class="gold" id="scanButton">
      Scan Barcode
    </button>
    <button type="button" class="gold" id="lookupButton">
      Look Up ISBN
    </button>
  </div>

  <div class="field">
    <label for="titleLookup">Find a book by title (no barcode needed)</label>
    <input id="titleLookup" placeholder="Enter book title" autocomplete="off">
  </div>
  <button type="button" class="gold" id="titleLookupButton">Search by Title</button>
  <div id="titleResults" class="title-results" aria-live="polite"></div>
  <video id="scanner" playsinline muted hidden></video>
  <p id="scanMessage" class="message"></p>

  <form id="bookForm">
    <div class="field">
      <label for="title">Title *</label>
      <input id="title" required>
    </div>
    <div class="field">
      <label for="authorInput">Author</label>
      <input id="authorInput">
    </div>
    <div class="field">
      <label for="genreInput">Genre</label>
      <input id="genreInput">
    </div>
    <div class="field">
      <label for="publisher">Publisher</label>
      <input id="publisher">
    </div>
    <div class="field">
      <label for="pages">Page Count</label>
      <input id="pages" type="number" min="0">
    </div>
    <div class="field">
      <label for="coverUrl">Cover Image URL</label>
      <input id="coverUrl" type="url">
    </div>
    <div class="field">
      <label for="shelfInput">Shelf</label>
      <input id="shelfInput">
    </div>
    <div class="field">
      <label for="readingInput">Reading Status</label>
      <select id="readingInput">
        <option>Unread</option>
        <option>Currently Reading</option>
        <option>Read</option>
      </select>
    </div>
    <div class="field">
      <label for="loanInput">Loan Status</label>
      <select id="loanInput">
        <option>Available</option>
        <option>Borrowed</option>
      </select>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" rows="4"></textarea>
    </div>

    <button type="submit" id="saveButton" class="gold">
      Save Book
    </button>
    <button type="button" id="deleteButton"
      class="gold" hidden>
      Delete Book
    </button>
    <p id="saveMessage" class="message" role="status"></p>
  </form>
</dialog>

<footer>
  ❧ The Enchanted Library ❧
  <p>May your shelves always hold another adventure.</p>
</footer>

<script>
"use strict";

const API_URL =
"https://script.google.com/macros/s/AKfycbxRI_MokHd0QWyyVGm_A3WpGR1YmRlSHNh5DZEVtQfsIx8Ui5DZfdOK-BJLOFs5pnA/exec";

const $ = id => document.getElementById(id);
const str = v => String(v ?? "");

let books = [];
let view = "all";
let editingId = null;
let originalBook = {};
let cameraStream = null;
let scanning = false;

function node(tag,cls,value) {
  const x = document.createElement(tag);
  if(cls) x.className = cls;
  if(value !== undefined) x.textContent = str(value);
  return x;
}

function refreshFilters() {
  for(const [id,field] of Object.entries({
    shelf:"Shelf",
    genre:"Genre",
    author:"Author"
  })) {
    const select = $(id);
    const previous = select.value;
    const first = select.options[0].cloneNode(true);
    select.replaceChildren(first);
    const values = [...new Set(
      books.flatMap(b =>
        str(b[field]).split(",")
          .map(s => s.trim()).filter(Boolean)
      )
    )].sort();
    values.forEach(v => select.add(new Option(v,v)));
    if(values.includes(previous)) select.value = previous;
  }
}

function matches(b,id,field) {
  const value = $(id).value;
  return !value || str(b[field])
    .split(",").map(s => s.trim()).includes(value);
}

function filteredBooks() {
  const q = $("search").value.toLowerCase().trim();
  return books.filter(b => {
    const searchable = [
      b.Title,b.Author,b.Genre,b.Description,b.ISBN
    ].map(str).join(" ").toLowerCase();
    if(q && !searchable.includes(q)) return false;
    if(!matches(b,"shelf","Shelf")) return false;
    if(!matches(b,"genre","Genre")) return false;
    if(!matches(b,"author","Author")) return false;
    if(!matches(b,"reading","Reading Status")) return false;
    if(view === "read" &&
      !["Read","Currently Reading"].includes(
        str(b["Reading Status"]))) return false;
    if(view === "loans" &&
      str(b["Loan Status"]) !== "Borrowed") return false;
    return true;
  });
}

function makeCard(b) {
  const card = node("article","book");
  const cover = node("div","cover");
  const url = str(b["Cover URL"]).trim();

  if(/^https:\/\//i.test(url)) {
    const img = node("img");
    img.src = url;
    img.alt = "Cover of " + str(b.Title);
    img.loading = "lazy";
    img.onerror = () => cover.replaceChildren(
      node("span","placeholder","📖")
    );
    cover.append(img);
  } else {
    cover.append(node("span","placeholder","📖"));
  }

  const info = node("div","info");
  info.append(
    node("h3","",b.Title || "Untitled Book"),
    node("p","",b.Author || "Unknown author"),
    node("span","tag",b.Genre || "Uncategorized"),
    node("span","tag",b["Reading Status"] || "Unread"),
    node("p","","Shelf: " + (b.Shelf || "Unassigned"))
  );

  const button = node("button","gold card-button","View / Edit");
  button.addEventListener("click",() => openEditor(b));
  info.append(button);
  card.append(cover,info);
  return card;
}

function render() {
  const result = filteredBooks();
  $("grid").replaceChildren();
  $("status").textContent =
    result.length +
    (result.length === 1 ? " book" : " books") +
    " in this view";

  if(!result.length) {
    $("grid").append(
      node("p","","No books match this view.")
    );
  } else {
    result.forEach(b => $("grid").append(makeCard(b)));
  }
}

async function loadBooks() {
  try {
    const response = await fetch(API_URL,{
      credentials:"omit",
      cache:"no-store"
    });
    if(!response.ok) {
      throw Error("HTTP " + response.status);
    }
    const data = await response.json();
    if(!data.success || !Array.isArray(data.books)) {
      throw Error("Invalid catalog response");
    }
    books = data.books;
    refreshFilters();
    render();
    return true;
  } catch(e) {
    console.error(e);
    $("status").textContent =
      "Unable to load books from Google Sheets.";
    return false;
  }
}

function setView(next) {
  view = next;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle(
      "active",b.dataset.view === view
    )
  );
  $("section").textContent = ({
    all:"✦ The Grand Library",
    shelves:"Browse the Shelves",
    read:"Reading Journal",
    loans:"Books on Loan"
  })[view];
  render();
}

function stopCamera() {
  scanning = false;
  if(cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  $("scanner").srcObject = null;
  $("scanner").hidden = true;
}

function openEditor(book=null) {
  stopCamera();
  editingId = book ? book["Book ID"] : null;
  originalBook = book ? {...book} : {};
  $("bookForm").reset();

  const fields = {
    isbn:"ISBN",
    title:"Title",
    authorInput:"Author",
    genreInput:"Genre",
    publisher:"Publisher",
    pages:"Page Count",
    coverUrl:"Cover URL",
    shelfInput:"Shelf",
    readingInput:"Reading Status",
    loanInput:"Loan Status",
    description:"Description"
  };

  for(const [id,key] of Object.entries(fields)) {
    $(id).value = book
      ? str(book[key])
      : ({
          readingInput:"Unread",
          loanInput:"Available"
        }[id] || "");
  }

  $("editorTitle").textContent =
    book ? "Edit Book" : "Add New Book";
  $("deleteButton").hidden = !book;
  $("saveMessage").textContent = "";
  $("scanMessage").textContent = "";
  $("titleLookup").value = "";
  $("titleResults").replaceChildren();
  $("editor").showModal();
}

function formBook() {
  return {
    ...originalBook,
    "Book ID":editingId || "",
    Title:$("title").value.trim(),
    Author:$("authorInput").value.trim(),
    ISBN:$("isbn").value.trim(),
    Genre:$("genreInput").value.trim(),
    Publisher:$("publisher").value.trim(),
    "Page Count":$("pages").value,
    "Cover URL":$("coverUrl").value.trim(),
    Shelf:$("shelfInput").value.trim(),
    "Reading Status":$("readingInput").value,
    "Loan Status":$("loanInput").value,
    Description:$("description").value.trim()
  };
}

/*
  OPEN LIBRARY ISBN LOOKUP

  Replaces Google Books with Open Library.
  No Google Books API key or quota required.
*/

function readableDescription(value) {
  if(typeof value === "string") return value;
  if(value && typeof value.value === "string") {
    return value.value;
  }
  return "";
}

async function lookupISBN() {
  const isbn = $("isbn").value
    .replace(/[^0-9X]/gi,"")
    .toUpperCase();

  if(!/^(?:\d{13}|\d{9}[\dX])$/.test(isbn)) {
    $("scanMessage").textContent =
      "Enter a valid 10- or 13-character ISBN.";
    return;
  }

  $("lookupButton").disabled = true;
  $("scanMessage").textContent =
    "Searching Open Library for your book...";

  try {
    const url =
      "https://openlibrary.org/isbn/" +
      encodeURIComponent(isbn) + ".json";

    const response = await fetch(url);

    if(response.status === 404) {
      $("scanMessage").textContent =
        "Book not found in Open Library. " +
        "You can enter its details manually.";
      return;
    }

    if(!response.ok) {
      throw Error("Open Library HTTP " + response.status);
    }

    const book = await response.json();

    if(!book || !book.title) {
      $("scanMessage").textContent =
        "No book details were returned. " +
        "Enter them manually.";
      return;
    }

    $("title").value = book.title || "";
    $("publisher").value =
      (book.publishers || []).join(", ");
    $("pages").value = book.number_of_pages || "";
    $("description").value =
      readableDescription(book.description);

    if(Array.isArray(book.covers) && book.covers.length) {
      $("coverUrl").value =
        "https://covers.openlibrary.org/b/id/" +
        book.covers[0] + "-L.jpg";
    } else {
      $("coverUrl").value =
        "https://covers.openlibrary.org/b/isbn/" +
        encodeURIComponent(isbn) + "-L.jpg?default=false";
    }

    // Author lookup: preserve the original ISBN flow, with safe fallbacks.
    // Open Library edition authors may be keys, nested author keys,
    // or absent altogether. An author request failure must not break
    // scanning or the rest of the book details.
    try {
      const authorKeys = (book.authors || [])
        .map(a => a?.key || a?.author?.key || "")
        .filter(key => /^\/authors\/[A-Za-z0-9]+$/.test(key));

      const authorResults = await Promise.allSettled(
        authorKeys.map(async key => {
          const r = await fetch("https://openlibrary.org" + key + ".json");
          if(!r.ok) return "";
          const author = await r.json();
          return author.name || author.personal_name || "";
        })
      );
      let names = authorResults
        .filter(r => r.status === "fulfilled" && r.value)
        .map(r => r.value);

      // If the edition doesn't list usable authors, search by ISBN.
      if(!names.length) {
        const searchResponse = await fetch(
          "https://openlibrary.org/search.json?isbn=" +
          encodeURIComponent(isbn) + "&limit=1&fields=author_name"
        );
        if(searchResponse.ok) {
          const searchData = await searchResponse.json();
          names = searchData.docs?.[0]?.author_name || [];
        }
      }
      if(names.length) $("authorInput").value = [...new Set(names)].join(", ");
    } catch(authorError) {
      console.warn("Author lookup unavailable; book details still loaded", authorError);
    }

    let subjects = book.subjects || [];
    if(!subjects.length && Array.isArray(book.works) && book.works[0]?.key) {
      try {
        const workResponse = await fetch("https://openlibrary.org" + book.works[0].key + ".json");
        if(workResponse.ok) {
          const work = await workResponse.json();
          subjects = work.subjects || [];
          if(!$("description").value) $("description").value = readableDescription(work.description);
        }
      } catch(error) { console.warn("Work metadata unavailable",error); }
    }
    $("genreInput").value = subjects.slice(0,3).join(", ");

    $("scanMessage").textContent =
      "Book found! Review the details, " +
      "then save when saving is enabled.";

  } catch(e) {
    console.error("Open Library lookup error:",e);
    $("scanMessage").textContent =
      "Open Library is temporarily unavailable. " +
      "Check your connection or enter details manually.";
  } finally {
    $("lookupButton").disabled = false;
  }
}


// Title lookup is independent of the catalog search and does not require an ISBN.
async function lookupTitle() {
  const query = $("titleLookup").value.trim();
  const results = $("titleResults");
  results.replaceChildren();
  if(query.length < 2) {
    results.append(node("p", "", "Enter at least two characters of a title."));
    return;
  }
  $("titleLookupButton").disabled = true;
  results.append(node("p", "", "Searching Open Library..."));
  try {
    const response = await fetch("https://openlibrary.org/search.json?title=" + encodeURIComponent(query) + "&limit=12&fields=key,title,author_name,first_publish_year,cover_i,isbn,edition_key,publisher,number_of_pages_median,subject");
    if(!response.ok) throw Error("Open Library search failed");
    const data = await response.json();
    results.replaceChildren();
    if(!data.docs || !data.docs.length) {
      results.append(node("p", "", "No matching books found. You can enter the details manually below."));
      return;
    }
    for(const b of data.docs) {
      const btn = node("button", "title-result");
      btn.type = "button";
      if(b.cover_i) {
        const img = node("img");
        img.src = "https://covers.openlibrary.org/b/id/" + b.cover_i + "-S.jpg";
        img.alt = "";
        btn.append(img);
      }
      const summary = node("span");
      summary.append(node("strong", "", b.title || "Untitled"));
      summary.append(node("small", "", (b.author_name || []).slice(0,2).join(", ") + (b.first_publish_year ? " · " + b.first_publish_year : "")));
      btn.append(summary);
      btn.addEventListener("click", () => selectTitleResult(b));
      results.append(btn);
    }
  } catch(error) {
    console.error(error);
    results.replaceChildren(node("p", "", "Title search is unavailable right now. You can still enter the book manually."));
  } finally {
    $("titleLookupButton").disabled = false;
  }
}

async function selectTitleResult(b) {
  $("title").value = b.title || "";
  $("authorInput").value = (b.author_name || []).join(", ");
  $("publisher").value = (b.publisher || []).slice(0,2).join(", ");
  $("pages").value = b.number_of_pages_median || "";
  $("genreInput").value = (b.subject || []).slice(0,3).join(", ");
  $("isbn").value = ""; // Do not assume an ISBN identifies this particular edition.
  $("coverUrl").value = b.cover_i ? "https://covers.openlibrary.org/b/id/" + b.cover_i + "-L.jpg" : "";
  $("description").value = "";
  $("titleResults").replaceChildren();
  $("scanMessage").textContent = "Book selected. Review the details, choose a shelf, and save.";
  if(/^\/works\/OL[0-9]+W$/.test(b.key || "")) {
    try {
      const response = await fetch("https://openlibrary.org" + b.key + ".json");
      if(response.ok) {
        const work = await response.json();
        $("description").value = readableDescription(work.description);
        if(!$("genreInput").value && Array.isArray(work.subjects))
          $("genreInput").value = work.subjects.slice(0,3).join(", ");
      }
    } catch(error) { console.warn("Additional book details unavailable", error); }
  }
}

/*
  BARCODE SCANNER
*/

async function scanBarcode() {
  if(scanning) {
    stopCamera();
    return;
  }

  if(!("BarcodeDetector" in window)) {
    $("scanMessage").textContent =
      "This browser does not support barcode scanning. " +
      "Enter the ISBN manually.";
    return;
  }

  try {
    const formats = (
      await BarcodeDetector.getSupportedFormats()
    ).filter(x => ["ean_13","ean_8"].includes(x));

    if(!formats.length) {
      throw Error("Unsupported barcode format");
    }

    const detector = new BarcodeDetector({formats});

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:"environment"}},
        audio:false
      });

    $("scanner").srcObject = cameraStream;
    $("scanner").hidden = false;
    await $("scanner").play();
    scanning = true;

    $("scanMessage").textContent =
      "Point your camera at the ISBN barcode.";

    async function detect() {
      if(!scanning) return;

      try {
        const codes = await detector.detect($("scanner"));
        const match = codes.find(c =>
          /^(978|979)\d{10}$/.test(c.rawValue)
        );

        if(match) {
          $("isbn").value = match.rawValue;
          stopCamera();
          await lookupISBN();
          return;
        }
      } catch(e) {
        console.error(e);
      }

      if(scanning) setTimeout(detect,250);
    }

    detect();

  } catch(e) {
    stopCamera();
    $("scanMessage").textContent =
      "Camera unavailable. Enter the ISBN manually.";
  }
}

/*
  GOOGLE SHEETS WRITE CONNECTION

  Requires the future Apps Script backend update.
*/

async function sendChange(request) {
  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    body:new URLSearchParams({
      payload:JSON.stringify(request)
    })
  });
}

async function verifyChange(action,book,id,priorIds) {
  for(let i=0;i<6;i++) {
    await new Promise(r => setTimeout(r,1200));

    if(!await loadBooks()) continue;

    if(action === "add") {
      if(books.some(b =>
        !priorIds.has(str(b["Book ID"])) &&
        str(b.Title) === str(book.Title) &&
        str(b.ISBN) === str(book.ISBN)
      )) return true;

    } else if(action === "delete") {
      if(!books.some(b =>
        str(b["Book ID"]) === str(id)
      )) return true;

    } else {
      const b = books.find(b =>
        str(b["Book ID"]) === str(id)
      );

      if(b && [
        "Title","Author","ISBN","Genre",
        "Publisher","Page Count","Cover URL",
        "Shelf","Reading Status","Loan Status",
        "Description"
      ].every(k => str(b[k]) === str(book[k]))) {
        return true;
      }
    }
  }
  return false;
}

async function saveBook(e) {
  e.preventDefault();

  const book = formBook();
  const action = editingId ? "update" : "add";
  const id = editingId;
  const priorIds = new Set(
    books.map(b => str(b["Book ID"]))
  );

  if(!book.Title) return;

  $("saveButton").disabled = true;
  $("saveMessage").textContent = "Saving book...";

  try {
    await sendChange({action,book});

    if(!await verifyChange(
      action,book,id,priorIds
    )) {
      throw Error("Save not verified");
    }

    $("editor").close();
    stopCamera();

  } catch(e) {
    console.error(e);
    $("saveMessage").textContent =
      "Save could not be verified. Check the catalog " +
      "before trying again to avoid duplicates.";
  } finally {
    $("saveButton").disabled = false;
  }
}

async function deleteBook() {
  if(!editingId ||
     !confirm("Permanently delete this book?")) return;

  const id = editingId;
  $("deleteButton").disabled = true;
  $("saveMessage").textContent = "Deleting...";

  try {
    await sendChange({action:"delete",id});

    if(!await verifyChange(
      "delete",{},id,new Set()
    )) {
      throw Error("Delete not verified");
    }

    $("editor").close();
    stopCamera();

  } catch(e) {
    console.error(e);
    $("saveMessage").textContent =
      "Deletion could not be verified. Check the catalog.";
  } finally {
    $("deleteButton").disabled = false;
  }
}

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener(
    "click",() => setView(b.dataset.view)
  )
);

["search","shelf","genre","author","reading"].forEach(id =>
  $(id).addEventListener(
    id === "search" ? "input" : "change",
    render
  )
);

$("addButton").addEventListener(
  "click",() => openEditor()
);

$("closeEditor").addEventListener("click",() => {
  $("editor").close();
  stopCamera();
});

$("editor").addEventListener("close",stopCamera);
$("scanButton").addEventListener("click",scanBarcode);
$("lookupButton").addEventListener("click",lookupISBN);
$("titleLookupButton").addEventListener("click",lookupTitle);
$("titleLookup").addEventListener("keydown",e => { if(e.key === "Enter") { e.preventDefault(); lookupTitle(); } });
$("bookForm").addEventListener("submit",saveBook);
$("deleteButton").addEventListener("click",deleteBook);

async function startLibrary() {
  await loadBooks();
  const requestedShelf = new URLSearchParams(location.search).get("shelf");
  if(requestedShelf) {
    const selector = $("shelf");
    if(!Array.from(selector.options).some(o => o.value.toLowerCase() === requestedShelf.toLowerCase()))
      selector.add(new Option(requestedShelf,requestedShelf));
    const option = Array.from(selector.options).find(o => o.value.toLowerCase() === requestedShelf.toLowerCase());
    selector.value = option.value;
    setView("shelves");
  }
}
startLibrary();
