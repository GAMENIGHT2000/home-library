
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Home Library</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3eb;
      color: #332b25;
    }
    header {
      background: #49382e;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
      text-align: center;
    }
    .card h2 { margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <h1>My Home Library</h1>
    <p>Your personal collection, all in one place.</p>
    
<script>
  document.addEventListener("DOMContentLoaded", function () {
    console.log("Home Library website loaded successfully!");
  });
</script>

  </header>

  <main>
    <input type="search" placeholder="Search your books..."
           aria-label="Search books">

    <div class="grid">
      <div class="card">
        <h2>My Books</h2>
        <p>Browse your entire collection</p>
      </div>
      <div class="card">
        <h2>My Shelves</h2>
        <p>Find books by shelf location</p>
      </div>
      <div class="card">
        <h2>Reading Status</h2>
        <p>Read, unread, and currently reading</p>
      </div>
      <div class="card">
        <h2>Borrowed Books</h2>
        <p>Track books you've lent out</p>
      </div>
    </div>
  </main>
</body>
</html>
